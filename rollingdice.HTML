<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {

margin: 0;

height: 100vh;

background: linear-gradient(135deg, #667eea, #764ba2);

display: flex;

justify-content: center;

align-items: center;

font-family: Arial, sans-serif;

}
.container {

background-color: white;

padding: 40px;

border-radius: 15px;

text-align: center;

box-shadow: 0px 10px 25px rgba(0,0,0,0.3);

width: 300px;

}
h1 {

margin-bottom: 20px;

color: #333;

}

.dice {

font-size: 100px;

margin: 20px 0;

transition: transform 0.2s ease;

}

button {

padding: 12px 25px;

font-size: 18px;

background-color: #667eea;

color: white;

border: none;

border-radius: 8px;

cursor: pointer;

}

button:hover {

background-color: #5a67d8;

}`
    </style>
</head>
<body>
    <h1>Rolling Dice</h1>
    <div class="container">
        <h1> Dice Roller Game </h1>
        <div id="dice" class="dice"></div>
        <button onclick="stopStart()">Roll / Stop</button>
     </div>
     
     </body>
     </html>
